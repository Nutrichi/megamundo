<style>
  :root {
    color-scheme: dark;

    /* Megamundo-palet */
    --mm-pink:   #d93ba1;
    --mm-red:    #f25e3d;
    --mm-orange: #f2a341;
    --mm-yellow: #f2d95c;
    --mm-green:  #5cd98a;
    --mm-cyan:   #3dc5d9;
    --mm-blue:   #3068d9;

    --mm-spectrum: linear-gradient(90deg,
      var(--mm-pink) 0%, var(--mm-red) 17%, var(--mm-orange) 33%,
      var(--mm-yellow) 50%, var(--mm-green) 67%, var(--mm-cyan) 83%,
      var(--mm-blue) 100%);

    --bg: #0a0a12;
    --fg: #f2f0f6;
    --muted: #8d8aa3;
    --faint: #5d5a72;
    --line: #2c2a3d;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 6vw, 3rem) clamp(1rem, 5vw, 2rem);
    padding-bottom: max(clamp(1.5rem, 6vw, 3rem), env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-wrap: break-word;
  }

  main { width: 100%; max-width: 32rem; text-align: center; }

  .globe {
    display: block;
    width: min(46vw, 11rem);
    height: auto;
    margin: 0 auto clamp(1.25rem, 4vw, 1.75rem);
  }

  .globe .band-1 { fill: var(--mm-pink); }
  .globe .band-2 { fill: var(--mm-red); }
  .globe .band-3 { fill: var(--mm-orange); }
  .globe .band-4 { fill: var(--mm-yellow); }
  .globe .band-5 { fill: var(--mm-green); }
  .globe .band-6 { fill: var(--mm-cyan); }
  .globe .band-7 { fill: var(--mm-blue); }

  .badge {
    display: inline-block;
    margin-bottom: clamp(1rem, 3vw, 1.5rem);
    padding: .35rem .85rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: .72rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    margin: 0 0 .75rem;
    font-size: clamp(2rem, 9vw, 3.25rem);
    font-weight: 800;
    letter-spacing: -.01em;
    color: var(--mm-pink);
    text-shadow: 0 0 2rem rgba(217, 59, 161, .4);
  }

  p.tagline {
    margin: 0 auto;
    max-width: 26rem;
    font-size: clamp(.95rem, 3.5vw, 1.05rem);
    color: var(--muted);
    text-wrap: balance;
  }

  .rule {
    width: min(100%, 16rem);
    height: 3px;
    margin: clamp(2rem, 7vw, 2.75rem) auto 0;
    border-radius: 999px;
    background: var(--mm-spectrum);
    opacity: .8;
  }

  footer {
    margin-top: clamp(1.75rem, 5vw, 2.5rem);
    font-size: .78rem;
    line-height: 1.7;
    color: var(--faint);
  }
</style>
</head>
<body>
<main>
  <svg class="globe" viewBox="0 0 200 200" role="img" aria-label="Megamundo logo">
    <defs>
      <clipPath id="ball"><circle cx="100" cy="100" r="96"/></clipPath>
    </defs>
    <g clip-path="url(#ball)">
      <rect class="band-1" x="0" y="4.000" width="200" height="23.143"/>
      <rect class="band-2" x="0" y="32.143" width="200" height="23.143"/>
      <rect class="band-3" x="0" y="60.286" width="200" height="23.143"/>
      <rect class="band-4" x="0" y="88.429" width="200" height="23.143"/>
      <rect class="band-5" x="0" y="116.571" width="200" height="23.143"/>
      <rect class="band-6" x="0" y="144.714" width="200" height="23.143"/>
      <rect class="band-7" x="0" y="172.857" width="200" height="23.143"/>
    </g>
  </svg>
  <div><span class="badge">Coming soon</span></div>
  <h1>MEGAMUNDO</h1>
  <p class="tagline">A fansite about Grand Theft Auto VI. News, guides and everything out of Leonida.</p>
  <div class="rule"></div>
  <footer>
    megamundo.be is an independent fansite and is not affiliated with Rockstar Games.<br>
    Grand Theft Auto and GTA are trademarks of Take-Two Interactive.
  </footer>
</main>
</body>
</html>
