<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megamundo, GTA 6 fansite</title>
<meta name="description" content="Megamundo is een fansite over Grand Theft Auto VI: nieuws, gidsen en alles uit Leonida en Vice City.">
<link rel="canonical" href="https://megamundo.be/">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://megamundo.be/">
<meta property="og:title" content="Megamundo, GTA 6 fansite">
<meta property="og:description" content="Nieuws, gidsen en alles uit Leonida en Vice City.">
<meta property="og:image" content="https://megamundo.be/assets/logo_only.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    color-scheme: dark;

    /* Megamundo-palet, afgelezen van het logo */
    --mm-magenta: #fe05fe;
    --mm-red:     #fc1f30;
    --mm-orange:  #ff9e03;
    --mm-yellow:  #fdec06;
    --mm-green:   #71fb85;
    --mm-cyan:    #01e2fd;
    --mm-azure:   #008cfd;
    --mm-blue:    #0038fc;
    --mm-indigo:  #001dfb;

    --mm-spectrum: linear-gradient(90deg,
      var(--mm-magenta) 0%, var(--mm-red) 13%, var(--mm-orange) 27%,
      var(--mm-yellow) 40%, var(--mm-green) 54%, var(--mm-cyan) 68%,
      var(--mm-azure) 81%, var(--mm-blue) 92%, var(--mm-indigo) 100%);

    --bg: #000;
    --fg: #fff;
    --muted: #8b8b96;
    --line: #1c1c22;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main { width: 100%; max-width: 40rem; text-align: center; }

  .logo {
    display: block;
    width: min(100%, 30rem);
    margin: 0 auto 2rem;
    filter: drop-shadow(0 0 5rem rgba(1, 226, 253, .28));
  }

  .badge {
    display: inline-block;
    margin-bottom: 1.25rem;
    padding: .35rem .9rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    margin: 0 0 .75rem;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 800;
    letter-spacing: -.01em;
  }

  p.tagline {
    margin: 0 auto;
    max-width: 30rem;
    font-size: 1.05rem;
    color: var(--muted);
  }

  .rule {
    width: min(100%, 22rem);
    height: 3px;
    margin: 2.5rem auto 0;
    border-radius: 999px;
    background: var(--mm-spectrum);
    opacity: .85;
  }

  footer {
    margin-top: 2.5rem;
    font-size: .8rem;
    line-height: 1.7;
    color: #55555f;
  }

  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    .logo { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(1.25rem) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/logo_only.png" width="512" height="512" alt="Megamundo.be">
  <div><span class="badge">Binnenkort</span></div>
  <h1>Een fansite over Grand Theft Auto VI</h1>
  <p class="tagline">Nieuws, gidsen en alles uit Leonida en Vice City. De site wordt op dit moment gebouwd.</p>
  <div class="rule"></div>
  <footer>
    megamundo.be is een fansite en staat los van Rockstar Games.<br>
  </footer>
</main>
</body>
</html>
