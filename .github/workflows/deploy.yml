# Bouwt de site en zet hem op GitHub Pages.
#
# Live sinds 11 september 2026: deze workflow publiceert dist/, de Astro-site.
#
# De Pages-bron moet op "GitHub Actions" staan (Settings → Pages → Build and
# deployment → Source). Tot 11 september stond hij op "Deploy from a branch":
# dan draaide bij elke push ook GitHub's eigen Jekyll-bouw ("pages build and
# deployment"), die naar dezelfde site publiceerde en tegen deze workflow
# racete, en hing het eigen domein aan het CNAME-bestand in de repo.
#
# Van 10 tot 11 september publiceerde hij bewust de placeholder uit de wortel
# van de publieke repo. Wil je die ooit tijdelijk terug: haal index.html,
# robots.txt, sitemap.xml, CNAME, .nojekyll en assets/ uit commit bfdab20 van
# de publieke repo, zet een stap die ze naar _site kopieert, en maak
# `path: dist` hieronder `path: _site`.
#
# Daily Clips en Streams (fase 7, §10.1): de workflow draait ook op schema.
# Vlak voor de build haalt scripts/fetch-feeds.mjs de streams en de clips op.
# Er wordt niets gecommit; de opgehaalde bestanden gaan van run naar run mee
# in de cache. YouTube wordt maar één keer per uur gevraagd, dat regelt het
# script zelf. De sleutels zijn repo secrets.
#
# De Node-versie komt uit .nvmrc, zodat de Action en de twee machines
# nooit uit elkaar lopen.
#
# De acties van GitHub zijn op 13 september 2026 bijgewerkt naar hun nieuwste
# hoofdversie, gemaakt voor Node 24 (checkout v7, setup-node v7, cache v6,
# configure-pages v6, upload-pages-artifact v5, deploy-pages v5). Wat daarbij
# kon breken, nagekeken in de release notes:
#   - setup-node cachet npm sinds v5 ook vanzelf; hier staat `cache: npm` al.
#   - upload-pages-artifact neemt sinds v4 geen bestanden meer mee waarvan de
#     naam met een punt begint. In dist/ zijn dat alleen .nojekyll (niet nodig:
#     deze workflow draait geen Jekyll) en een verdwaalde .DS_Store. Komt er
#     ooit zo'n bestand bij dat wel online moet, zet dan
#     `include-hidden-files: true` bij die stap.

name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Elk kwartier, maar bewust niet op :00, :15, :30 en :45. Dat zijn de
  # drukste momenten bij GitHub, en daar worden geplande runs het eerst
  # uitgesteld of weggelaten: met '*/15' draaide er na de lancering drie uur
  # lang geen enkele (11 september 2026). In de praktijk start GitHub ze om de
  # één tot vijf uur, en dat is goed zo (Nutri, 13 september 2026; §10.1).
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwe push wacht netjes op zijn beurt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # De vorige ophaling terug. Zo hoeft YouTube niet bij elke run, en
      # heeft de site nog iets als een API even niet antwoordt.
      - name: Vorige feeds terughalen
        uses: actions/cache/restore@v6
        with:
          path: src/data/generated
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      - name: Clips en streams ophalen
        run: npm run feeds
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Feeds bewaren voor de volgende run
        if: hashFiles('src/data/generated/*.json') != ''
        uses: actions/cache/save@v6
        with:
          path: src/data/generated
          key: feeds-${{ github.run_id }}

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # De app een seintje geven dat er nieuws kan zijn (IOS-APP-PLAN.md, fase 4).
      #
      # Deze aanroep geeft niets mee en mag dus bij elke build gebeuren, ook bij
      # de geplande runs voor Clips en Streams. De Edge Function haalt zelf het
      # manifest op, claimt de nieuwste post in sent_notifications en stuurt
      # alleen als dat claimen lukt. Twee builds achter elkaar leveren dus één
      # melding, en nul als er geen nieuwe post is.
      #
      # Mislukt de aanroep, dan is de site gewoon uitgerold en gaat de run niet
      # rood: een gemiste melding is geen kapotte site. Zonder het geheim slaat
      # de stap zichzelf over, zodat een fork of een test niets probeert.
      #
      # Het geheim gaat als omgevingsvariabele en niet in de opdrachtregel: zo
      # staat het niet in het commando dat in het logboek terechtkomt. De
      # controle staat in de shell en niet in een `if`, omdat de secrets-context
      # daar niet betrouwbaar beschikbaar is.
      - name: De app een seintje geven
        continue-on-error: true
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          if [ -z "$NOTIFY_TOKEN" ]; then
            echo "Geen NOTIFY_TOKEN ingesteld; deze stap doet niets."
            exit 0
          fi
          curl -fsS -X POST \
            -H "x-notify-token: $NOTIFY_TOKEN" \
            https://onryvgtkejqwzkhpovzf.supabase.co/functions/v1/notify
