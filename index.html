<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megamundo, GTA 6 fansite</title>
<meta name="description" content="Megamundo, een fansite over Grand Theft Auto VI: nieuws, gidsen en alles over Vice City en Leonida.">
<link rel="canonical" href="https://megamundo.be/">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a12;
    --fg: #f2f0f6;
    --muted: #8d8aa3;
    --red: #ff2d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; text-align: center; }
  .globe { width: min(60vw, 15rem); height: auto; margin-bottom: 1.5rem; }
  h1 {
    margin: 0 0 .75rem;
    font-size: clamp(2.75rem, 12vw, 5rem);
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--red);
    text-shadow: 0 0 2.5rem rgba(255, 45, 45, .45);
  }
  p.tagline { margin: 0; font-size: 1.1rem; color: var(--muted); }
  .badge {
    display: inline-block; margin-bottom: 1.5rem;
    padding: .35rem .85rem; border: 1px solid #2c2a3d; border-radius: 999px;
    font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  footer { margin-top: 3.5rem; font-size: .8rem; color: #5d5a72; }
</style>
</head>
<body>
<main>
  <svg class="globe" viewBox="0 0 200 190" role="img" aria-label="Megamundo-logo">
    <defs>
      <clipPath id="ball"><circle cx="100" cy="95" r="88"/></clipPath>
    </defs>
    <g clip-path="url(#ball)">
      <path d="M12 7h176v20H12z" fill="#e5399b"/>
      <path d="M12 32h176v20H12z" fill="#f0603a"/>
      <path d="M12 57h176v20H12z" fill="#f6a63c"/>
      <path d="M12 82h176v20H12z" fill="#f3e05a"/>
      <path d="M12 107h176v20H12z" fill="#78d6a4"/>
      <path d="M12 132h176v20H12z" fill="#4bb2e0"/>
      <path d="M12 157h176v26H12z" fill="#2f5fd8"/>
    </g>
  </svg>
  <div><span class="badge">Binnenkort</span></div>
  <h1>MEGAMUNDO</h1>
  <p class="tagline">Een fansite over Grand Theft Auto VI. Nieuws, gidsen en alles uit Leonida.</p>
  <footer>megamundo.be is een fansite en geen officiële site van Rockstar Games.</footer>
</main>
</body>
</html>
