# Bouwt de site en zet hem op GitHub Pages.
#
# TIJDELIJK (10 september 2026): deze workflow publiceert de PLACEHOLDER en
# niet de Astro-site. De Pages-bron blijkt op "GitHub Actions" te staan en
# niet op "branch" zoals eerder aangenomen, dus elke push naar main zette de
# Astro-site live. Die is nog leeg, en dat hoort megamundo.be niet te tonen.
#
# Terugdraaien is één ding: de stap "Zet de placeholder klaar" weghalen en
# `path: _site` weer `path: dist` maken. Doe dat zodra de Astro-site beter is
# dan de placeholder (§ "Wat openstaat voor Nutri" in STATUS.md).
#
# De build blijft draaien, ook nu hij niet gepubliceerd wordt: dan merkt de
# Action het nog steeds als een post de build breekt.
#
# Daily Clips en Streams (fase 7, §10.1): de workflow draait ook elk kwartier
# op schema. Vlak voor de build haalt scripts/fetch-feeds.mjs de streams en de
# clips op. Er wordt niets gecommit; de opgehaalde bestanden gaan van run naar
# run mee in de cache. YouTube wordt maar één keer per uur gevraagd, dat
# regelt het script zelf. De sleutels zijn repo secrets.
#
# De Node-versie komt uit .nvmrc, zodat de Action en de twee machines
# nooit uit elkaar lopen.

name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Best effort: GitHub start een geplande run soms tien tot twintig minuten
  # later. Reken op "ongeveer elk kwartier", niet op de klok (§10.1).
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwe push wacht netjes op zijn beurt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # De vorige ophaling terug. Zo hoeft YouTube niet bij elke run, en
      # heeft de site nog iets als een API even niet antwoordt.
      - name: Vorige feeds terughalen
        uses: actions/cache/restore@v4
        with:
          path: src/data/generated
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      - name: Clips en streams ophalen
        run: npm run feeds
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Feeds bewaren voor de volgende run
        if: hashFiles('src/data/generated/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: src/data/generated
          key: feeds-${{ github.run_id }}

      - run: npm run build

      - uses: actions/configure-pages@v5

      # TIJDELIJK: alleen de placeholder uit de wortel gaat live.
      # Uitsluitend deze vijf dingen, zodat er geen bronbestand meelift.
      - name: Zet de placeholder klaar
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml CNAME .nojekyll _site/
          cp -R assets _site/assets
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
