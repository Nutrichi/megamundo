# Bouwt de site en zet hem op GitHub Pages.
#
# Let op: dit werkt pas nadat de Pages-bron in de instellingen van de repo
# van "branch" naar "GitHub Actions" is gezet. Tot dan blijft de oude
# placeholder de live site, en dat is de bedoeling.
#
# De Node-versie komt uit .nvmrc, zodat de Action en de twee machines
# nooit uit elkaar lopen.

name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwe push wacht netjes op zijn beurt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
